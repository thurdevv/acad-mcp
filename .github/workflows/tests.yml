name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # AutoCAD is not available on CI runners: live tests skip themselves.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -m "not live" -q
      - run: uv build
